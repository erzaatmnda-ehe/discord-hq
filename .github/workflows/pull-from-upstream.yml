name: Pull from Upstream

on:
  repository_dispatch:
    types: [upstream-updated]

jobs:
  pull-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/btdugm-stack/virtual-warga-discord.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Merge upstream/main
        run: git merge upstream/main --no-ff -m "Merge from upstream btdugm-stack/virtual-warga-discord"

      - name: Push changes
        run: git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
