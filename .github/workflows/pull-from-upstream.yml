name: Pull from Upstream

on:
  repository_dispatch:
    types: [upstream-updated]

jobs:
  pull-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/btdugm-stack/virtual-warga-discord.git

      - name: Fetch upstream main
        run: git fetch upstream main

      - name: Merge upstream/main
        run: git merge --no-edit upstream/main || { echo "Merge conflict detected"; exit 1; }

      - name: Push merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main
